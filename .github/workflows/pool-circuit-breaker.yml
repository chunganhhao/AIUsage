name: Pool circuit breaker regression

on:
  push:
    branches: ["feat/**"]
  pull_request:
    paths:
      - "QuotaBackend/**"
      - "scripts/*CircuitBreaker*"
      - "scripts/*pool_circuit_breaker*"
      - ".github/workflows/pool-circuit-breaker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-pools:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Antigravity quota and pool-breaker tests
        run: swift test --package-path QuotaBackend --filter 'AntigravityProviderTests|AntigravityPoolCircuitBreakerTests'
      - name: Standalone pool regression
        run: bash scripts/run_pool_circuit_breaker_regression.sh
      - name: Build QuotaServer
        run: swift build --package-path QuotaBackend --build-system native --product QuotaServer
