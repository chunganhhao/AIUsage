name: Build Personal AIUsage

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - patch*
      - personal-build

permissions:
  contents: read

jobs:
  build:
    name: Build Universal macOS App
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -project AIUsage.xcodeproj -scheme AIUsage \
            -destination "generic/platform=macOS" \
            -resolvePackageDependencies \
            -derivedDataPath build/DerivedData

      - name: Build Debug app (Token Saver integration)
        run: |
          xcodebuild -project AIUsage.xcodeproj -scheme AIUsage \
            -configuration Debug -destination "platform=macOS" \
            -derivedDataPath build/DebugDerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Run full QuotaBackend unit suite
        run: swift test --package-path QuotaBackend

      - name: Test Safe Trio and pool protection regressions
        run: |
          bash scripts/run_token_saver_settings_regression.sh
          bash scripts/run_token_saver_release_regression.sh
          bash scripts/run_token_saver_controller_regression.sh
          bash scripts/run_dmg_packaging_regression.sh
          bash scripts/run_pool_circuit_breaker_regression.sh
          bash scripts/run_account_identity_regression.sh
          bash scripts/run_common_config_regression.sh
          bash scripts/run_codex_reset_cards_regression.sh

      - name: Render Codex reset cards previews
        run: TMPDIR="$RUNNER_TEMP" bash scripts/run_codex_reset_cards_regression.sh --render "$RUNNER_TEMP/reset-cards-preview"

      - name: Upload Codex reset cards previews
        uses: actions/upload-artifact@v4
        with:
          name: codex-reset-cards-preview
          path: ${{ runner.temp }}/reset-cards-preview
          if-no-files-found: error

      - name: Free up disk space before packaging
        run: |
          rm -rf build/DebugDerivedData build/DerivedData QuotaBackend/.build
          df -h

      - name: Build & Package Release Artifacts
        env:
          REQUIRE_STABLE_SIGNING: "0"
          REQUIRE_SPARKLE_SIGNING: "0"
        run: |
          ./scripts/package-release.sh

      - name: Verify pool circuit breaker in packaged backend
        run: |
          VERIFY_ROOT="$RUNNER_TEMP/aiusage-pool-package"
          mkdir -p "$VERIFY_ROOT"
          ditto -x -k dist/AIUsage-*-macOS.zip "$VERIFY_ROOT"
          HELPER="$VERIFY_ROOT/AIUsage.app/Contents/Helpers/QuotaServer"
          test -x "$HELPER"
          codesign --verify --deep --strict "$VERIFY_ROOT/AIUsage.app"
          python3 -c 'from pathlib import Path; import sys; assert b"Pool protection requires CLIProxyAPI >= 8.0.43" in Path(sys.argv[1]).read_bytes(); print("Packaged pool-protection marker verified")' "$HELPER"
          shasum -a 256 dist/*.zip dist/*.dmg > dist/SHA256SUMS
          printf 'commit=%s\nworkflow_run=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > dist/build-provenance.txt

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIUsage-macOS-Patched
          path: |
            dist/*.zip
            dist/*.dmg
            dist/SHA256SUMS
            dist/build-provenance.txt
          if-no-files-found: error
