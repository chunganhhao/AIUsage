name: Build Personal AIUsage

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - patch*
      - personal-build

permissions:
  contents: write

jobs:
  build:
    name: Build Universal macOS App
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Resolve SPM Dependencies
        run: |
          xcodebuild -project AIUsage.xcodeproj -scheme AIUsage \
            -destination "generic/platform=macOS" \
            -resolvePackageDependencies \
            -derivedDataPath build/DerivedData

      - name: Build & Package Release Artifacts
        env:
          REQUIRE_STABLE_SIGNING: "0"
          REQUIRE_SPARKLE_SIGNING: "0"
        run: |
          ./scripts/package-release.sh

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIUsage-macOS-Patched
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
